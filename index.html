<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدل سه‌بعدی با پشتیبانی VR و AR</title>
    <!-- بارگذاری کتابخانه A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- افزونه AR (اختیاری) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-ar@1.8.2/dist/aframe-ar.min.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #enter-ar-msg {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <!-- صحنه اصلی -->
    <a-scene
      vr-mode-ui="enabled: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="antialias: true;"
      background="color: #ECECEC"
    >
      <!-- نورپردازی -->
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

      <!-- مدل سه‌بعدی -->
      <a-entity
        gltf-model="url(https://modelviewer.dev/shared-assets/models/Astronaut.glb)"
        scale="1 1 1"
        position="0 1.6 -2"
        rotation="0 45 0"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 10000; easing: linear"
      ></a-entity>

      <!-- دوربین -->
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <!-- پیام کوچک برای راهنمای AR -->
    <div id="enter-ar-msg">برای ورود به حالت VR روی آیکون هدست (🔲) بزنید</div>
  </body>
</html>
