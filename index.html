<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استریوسکوپی مدل سه‌بعدی</title>

  <!-- کتابخانه model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .normal-view {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* حالت استریوسکوپی (دو چشم) */
    .stereo {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
    }

    .eye {
      flex: 1;
      border: 1px solid #111;
      overflow: hidden;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- نمای معمولی -->
  <div id="normal" class="normal-view">
    <model-viewer id="mainViewer"
      src="cross_section_of_artery_1.glb"
      alt="مدل سه‌بعدی"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      style="width:100%; height:100%;"
    ></model-viewer>

    <div class="controls">
      <button class="btn" onclick="enterStereo()">👓 حالت VR (Cardboard)</button>
    </div>
  </div>

  <!-- نمای استریوسکوپی -->
  <div id="stereo" class="stereo" style="display:none;">
    <div class="eye">
      <model-viewer id="leftEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>
    <div class="eye">
      <model-viewer id="rightEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>

    <div class="controls">
      <button class="btn" onclick="exitStereo()">✖ خروج از VR</button>
    </div>
  </div>

  <script>
    const normalView = document.getElementById('normal');
    const stereoView = document.getElementById('stereo');
    const mainViewer = document.getElementById('mainViewer');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');

    // ورود به حالت استریوسکوپی
    function enterStereo() {
      // همگام‌سازی دوربین‌ها با مدل اصلی
      const orbit = mainViewer.getAttribute('camera-orbit');
      const fov = mainViewer.getAttribute('field-of-view');

      leftEye.setAttribute('camera-orbit', orbit);
      leftEye.setAttribute('field-of-view', fov);

      rightEye.setAttribute('camera-orbit', orbit);
      rightEye.setAttribute('field-of-view', fov);

      normalView.style.display = 'none';
      stereoView.style.display = 'flex';

      // شروع sync مداوم
      syncCameras();
    }

    // خروج از حالت استریوسکوپی
    function exitStereo() {
      stereoView.style.display = 'none';
      normalView.style.display = 'block';
    }

    // همگام‌سازی دوربین چپ و راست با حرکت کاربر
    function syncCameras() {
      if (stereoView.style.display === 'flex') {
        const orbit = mainViewer.getAttribute('camera-orbit');
        const fov = mainViewer.getAttribute('field-of-view');

        // کمی اختلاف افقی (parallax) برای استریو
        leftEye.setAttribute('camera-orbit', orbit.replace(/(\d+deg) (\d+deg) ([^ ]+)/,
          (m, a, b, c) => `${a} ${b} ${c}`));
        rightEye.setAttribute('camera-orbit', orbit.replace(/(\d+deg) (\d+deg) ([^ ]+)/,
          (m, a, b, c) => `${parseFloat(a) + 3}deg ${b} ${c}`));

        leftEye.setAttribute('field-of-view', fov);
        rightEye.setAttribute('field-of-view', fov);

        requestAnimationFrame(syncCameras);
      }
    }
  </script>
</body>
</html>
