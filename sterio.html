<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمایش استریوسکوپی مدل سه‌بعدی شریان</title>

  <!-- کتابخانه model-viewer با نسخه سازگار با دستگاه‌های قدیمی -->
  <script src="https://unpkg.com/@google/model-viewer@2.1.1/dist/model-viewer-legacy.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .normal-view {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* حالت استریوسکوپی (دو چشم) */
    .stereo {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-box-direction: normal;
          -ms-flex-direction: row;
              flex-direction: row;
      width: 100%;
      height: 100vh;
      display: none;
    }

    .eye {
      -webkit-box-flex: 1;
          -ms-flex: 1;
              flex: 1;
      overflow: hidden;
      position: relative;
    }

    .eye-left {
      border-left: 2px solid #333;
    }

    .eye-right {
      border-right: 2px solid #333;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      -webkit-transform: translateX(-50%);
          -ms-transform: translateX(-50%);
              transform: translateX(-50%);
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    
    /* برای نمایش در دستگاه موبایل با VR */
    @media (max-width: 768px) {
      .stereo {
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
            -ms-flex-direction: column;
                flex-direction: column;
      }
      .eye {
        width: 100%;
        height: 50vh;
      }
    }

    /* پیام خطا برای دستگاه‌های بدون پشتیبانی WebGL */
    .webgl-error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
          -ms-transform: translate(-50%, -50%);
              transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      z-index: 100;
    }
    
    /* پیام در حال بارگذاری */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
          -ms-transform: translate(-50%, -50%);
              transform: translate(-50%, -50%);
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- پیام در حال بارگذاری -->
  <div id="loading" class="loading">
    <h2>در حال بارگذاری...</h2>
    <p>لطفاً منتظر بمانید</p>
  </div>

  <!-- پیام خطا برای دستگاه‌های بدون پشتیبانی WebGL -->
  <div id="webglError" class="webgl-error">
    <h2>پشتیبانی نشده</h2>
    <p>متأسفانه دستگاه شما از گرافیک سه‌بعدی پشتیبانی نمی‌کند.</p>
    <p>لطفاً از مرورگر و دستگاه جدیدتر استفاده کنید.</p>
  </div>

  <!-- نمای معمولی -->
  <div id="normal" class="normal-view" style="display:none;">
    <model-viewer id="mainViewer"
      src="cross_section_of_artery_1.glb"
      alt="مدل سه‌بعدی مقطع شریان"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1.2"
      environment-image="neutral"
      style="width:100%; height:100%;"
    ></model-viewer>

    <div class="controls">
      <button class="btn" onclick="enterStereo()">👓 حالت استریوسکوپی</button>
    </div>
  </div>

  <!-- نمای استریوسکوپی -->
  <div id="stereo" class="stereo">
    <div class="eye eye-left">
      <model-viewer id="leftEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1.2"
        environment-image="neutral"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>
    <div class="eye eye-right">
      <model-viewer id="rightEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1.2"
        environment-image="neutral"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>

    <div class="controls">
      <button class="btn" onclick="exitStereo()">✖ خروج از حالت استریو</button>
    </div>
  </div>

  <script>
    // بررسی پشتیبانی از WebGL
    function checkWebGLSupport() {
      try {
        var canvas = document.createElement('canvas');
        return !!window.WebGLRenderingContext && 
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
      } catch(e) {
        return false;
      }
    }
    
    // بررسی پشتیبانی از custom elements
    function checkCustomElementsSupport() {
      return 'customElements' in window;
    }

    // وقتی صفحه کاملاً بارگذاری شد
    window.onload = function() {
      var loadingElement = document.getElementById('loading');
      var webglErrorElement = document.getElementById('webglError');
      var normalView = document.getElementById('normal');
      
      // بررسی پشتیبانی از WebGL
      if (!checkWebGLSupport()) {
        loadingElement.style.display = 'none';
        webglErrorElement.style.display = 'block';
        return;
      }
      
      // بررسی پشتیبانی از custom elements
      if (!checkCustomElementsSupport()) {
        loadingElement.style.display = 'none';
        webglErrorElement.innerHTML = '<h2>مرورگر قدیمی</h2><p>مرورگر شما از فناوری‌های لازم پشتیبانی نمی‌کند.</p><p>لطفاً مرورگر خود را به روزرسانی کنید.</p>';
        webglErrorElement.style.display = 'block';
        return;
      }
      
      // منتظر ماندن برای بارگذاری کامل model-viewer
      setTimeout(function() {
        if (typeof customElements !== 'undefined' && customElements.get('model-viewer')) {
          loadingElement.style.display = 'none';
          normalView.style.display = 'block';
          initApplication();
        } else {
          loadingElement.style.display = 'none';
          webglErrorElement.innerHTML = '<h2>خطای بارگذاری</h2><p>امکان بارگذاری کتابخانه سه‌بعدی وجود ندارد.</p>';
          webglErrorElement.style.display = 'block';
        }
      }, 2000);
    };

    function initApplication() {
      var normalView = document.getElementById('normal');
      var stereoView = document.getElementById('stereo');
      var mainViewer = document.getElementById('mainViewer');
      var leftEyeViewer = document.getElementById('leftEye');
      var rightEyeViewer = document.getElementById('rightEye');
      
      var isStereoMode = false;
      var cameraSyncInterval;

      // تابع برای تجزیه رشته camera-orbit
      function parseCameraOrbit(orbitString) {
        if (!orbitString) return { theta: 0, phi: 75, radius: 2 };
        
        var values = orbitString.split(' ');
        var theta = parseFloat(values[0]) || 0;
        var phi = parseFloat(values[1]) || 75;
        var radius = parseFloat(values[2]) || 2;
        
        return { theta: theta, phi: phi, radius: radius };
      }

      // تابع برای ایجاد رشته camera-orbit
      function createCameraOrbitString(theta, phi, radius) {
        return theta + 'deg ' + phi + 'deg ' + radius + 'm';
      }

      // تنظیمات اولیه برای حالت استریو
      function setupStereoView() {
        // استفاده از ویژگی cameraOrbit به جای getAttribute
        var orbit = mainViewer.cameraOrbit || '0deg 75deg 2m';
        var target = mainViewer.cameraTarget || '0m 0m 0m';
        
        var orbitData = parseCameraOrbit(orbit);
        
        // تنظیم دوربین برای چشم چپ با کمی جابجایی به راست
        leftEyeViewer.cameraOrbit = orbit;
        leftEyeViewer.cameraTarget = target;
        
        // تنظیم دوربین برای چشم راست با کمی جابجایی به چپ
        rightEyeViewer.cameraOrbit = orbit;
        rightEyeViewer.cameraTarget = target;
      }

      // ورود به حالت استریوسکوپی
      window.enterStereo = function() {
        // بررسی مجدد WebGL قبل از ورود به حالت استریو
        if (!checkWebGLSupport()) {
          alert('دستگاه شما از گرافیک سه‌بعدی پشتیبانی نمی‌کند. امکان نمایش استریوسکوپی وجود ندارد.');
          return;
        }
        
        setupStereoView();
        normalView.style.display = 'none';
        stereoView.style.display = 'flex';
        isStereoMode = true;
        
        // شروع همگام‌سازی دوربین‌ها
        startCameraSync();
        
        // اطلاع به کاربر برای استفاده از عینک VR
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          alert('لطفا تلفن خود را در عینک VR قرار دهید. برای خروج دکمه بازگشت را بزنید.');
        }
      };

      // خروج از حالت استریوسکوپی
      window.exitStereo = function() {
        clearInterval(cameraSyncInterval);
        stereoView.style.display = 'none';
        normalView.style.display = 'block';
        isStereoMode = false;
      };

      // همگام‌سازی دوربین‌ها در حالت استریو
      function startCameraSync() {
        cameraSyncInterval = setInterval(function() {
          if (!isStereoMode) return;
          
          // گرفتن موقعیت فعلی دوربین اصلی
          var orbit = mainViewer.cameraOrbit;
          var target = mainViewer.cameraTarget || '0m 0m 0m';
          
          // تجزیه موقعیت دوربین
          var orbitData = parseCameraOrbit(orbit);
          
          // ایجاد افست برای ایجاد اثر استریو (IPD - فاصله بین مردمکی)
          var ipdOffset = 0.5; // میزان افست به درجه
          
          // تنظیم دوربین برای چشم چپ
          var leftOrbit = createCameraOrbitString(
            orbitData.theta - ipdOffset,
            orbitData.phi,
            orbitData.radius
          );
          leftEyeViewer.cameraOrbit = leftOrbit;
          leftEyeViewer.cameraTarget = target;
          
          // تنظیم دوربین برای چشم راست
          var rightOrbit = createCameraOrbitString(
            orbitData.theta + ipdOffset,
            orbitData.phi,
            orbitData.radius
          );
          rightEyeViewer.cameraOrbit = rightOrbit;
          rightEyeViewer.cameraTarget = target;
        }, 100); // به روز رسانی هر 100 میلی‌ثانیه
      }

      // اضافه کردن event listener برای تغییرات دوربین
      if (mainViewer.addEventListener) {
        mainViewer.addEventListener('camera-change', function() {
          if (isStereoMode) {
            // اگر در حالت استریو هستیم، دوربین‌ها را به روز کنیم
            startCameraSync();
          }
        });
      }
    }
  </script>
</body>
</html>
