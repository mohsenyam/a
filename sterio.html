<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمایش استریوسکوپی مدل سه‌بعدی شریان</title>

  <!-- کتابخانه model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .normal-view {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* حالت استریوسکوپی (دو چشم) */
    .stereo {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      display: none;
    }

    .eye {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .eye-left {
      border-left: 2px solid #333;
    }

    .eye-right {
      border-right: 2px solid #333;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    
    /* برای نمایش در دستگاه موبایل با VR */
    @media (max-width: 768px) {
      .stereo {
        flex-direction: column;
      }
      .eye {
        width: 100%;
        height: 50vh;
      }
    }
  </style>
</head>
<body>

  <!-- نمای معمولی -->
  <div id="normal" class="normal-view">
    <model-viewer id="mainViewer"
      src="cross_section_of_artery_1.glb"
      alt="مدل سه‌بعدی مقطع شریان"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1.2"
      environment-image="neutral"
      style="width:100%; height:100%;"
    ></model-viewer>

    <div class="controls">
      <button class="btn" onclick="enterStereo()">👓 حالت استریوسکوپی</button>
    </div>
  </div>

  <!-- نمای استریوسکوپی -->
  <div id="stereo" class="stereo">
    <div class="eye eye-left">
      <model-viewer id="leftEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1.2"
        environment-image="neutral"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>
    <div class="eye eye-right">
      <model-viewer id="rightEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1.2"
        environment-image="neutral"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>

    <div class="controls">
      <button class="btn" onclick="exitStereo()">✖ خروج از حالت استریو</button>
    </div>
  </div>

  <script>
    const normalView = document.getElementById('normal');
    const stereoView = document.getElementById('stereo');
    const mainViewer = document.getElementById('mainViewer');
    const leftEyeViewer = document.getElementById('leftEye');
    const rightEyeViewer = document.getElementById('rightEye');
    
    let isStereoMode = false;
    let cameraSyncInterval;

    // تابع برای تجزیه رشته camera-orbit
    function parseCameraOrbit(orbitString) {
      if (!orbitString) return { theta: 0, phi: 75, radius: 2 };
      
      const values = orbitString.split(' ');
      const theta = parseFloat(values[0]) || 0;
      const phi = parseFloat(values[1]) || 75;
      const radius = parseFloat(values[2]) || 2;
      
      return { theta, phi, radius };
    }

    // تابع برای ایجاد رشته camera-orbit
    function createCameraOrbitString(theta, phi, radius) {
      return `${theta}deg ${phi}deg ${radius}m`;
    }

    // تنظیمات اولیه برای حالت استریو
    function setupStereoView() {
      // استفاده از ویژگی cameraOrbit به جای getAttribute
      const orbit = mainViewer.cameraOrbit || '0deg 75deg 2m';
      const target = mainViewer.cameraTarget || '0m 0m 0m';
      
      const orbitData = parseCameraOrbit(orbit);
      
      // تنظیم دوربین برای چشم چپ با کمی جابجایی به راست
      leftEyeViewer.cameraOrbit = orbit;
      leftEyeViewer.cameraTarget = target;
      
      // تنظیم دوربین برای چشم راست با کمی جابجایی به چپ
      rightEyeViewer.cameraOrbit = orbit;
      rightEyeViewer.cameraTarget = target;
    }

    // ورود به حالت استریوسکوپی
    function enterStereo() {
      setupStereoView();
      normalView.style.display = 'none';
      stereoView.style.display = 'flex';
      isStereoMode = true;
      
      // شروع همگام‌سازی دوربین‌ها
      startCameraSync();
      
      // اطلاع به کاربر برای استفاده از عینک VR
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        alert('لطفا تلفن خود را در عینک VR قرار دهید. برای خروج دکمه بازگشت را بزنید.');
      }
    }

    // خروج از حالت استریوسکوپی
    function exitStereo() {
      clearInterval(cameraSyncInterval);
      stereoView.style.display = 'none';
      normalView.style.display = 'block';
      isStereoMode = false;
    }

    // همگام‌سازی دوربین‌ها در حالت استریو
    function startCameraSync() {
      cameraSyncInterval = setInterval(() => {
        if (!isStereoMode) return;
        
        // گرفتن موقعیت فعلی دوربین اصلی
        const orbit = mainViewer.cameraOrbit;
        const target = mainViewer.cameraTarget || '0m 0m 0m';
        
        // تجزیه موقعیت دوربین
        const orbitData = parseCameraOrbit(orbit);
        
        // ایجاد افست برای ایجاد اثر استریو (IPD - فاصله بین مردمکی)
        const ipdOffset = 0.5; // میزان افست به درجه
        
        // تنظیم دوربین برای چشم چپ
        const leftOrbit = createCameraOrbitString(
          orbitData.theta - ipdOffset,
          orbitData.phi,
          orbitData.radius
        );
        leftEyeViewer.cameraOrbit = leftOrbit;
        leftEyeViewer.cameraTarget = target;
        
        // تنظیم دوربین برای چشم راست
        const rightOrbit = createCameraOrbitString(
          orbitData.theta + ipdOffset,
          orbitData.phi,
          orbitData.radius
        );
        rightEyeViewer.cameraOrbit = rightOrbit;
        rightEyeViewer.cameraTarget = target;
      }, 100); // به روز رسانی هر 100 میلی‌ثانیه
    }

    // بارگذاری اولیه
    window.addEventListener('load', () => {
      // اضافه کردن event listener برای تغییرات دوربین
      mainViewer.addEventListener('camera-change', () => {
        if (isStereoMode) {
          // اگر در حالت استریو هستیم، دوربین‌ها را به روز کنیم
          startCameraSync();
        }
      });
    });
  </script>
</body>
</html>
