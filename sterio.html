<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمایش استریوسکوپی شریان با ژیروسکوپ</title>

  <!-- بارگذاری Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- بارگذاری GLTFLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- بارگذاری OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- بارگذاری DeviceOrientationControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    .container { width: 100%; height: 100vh; position: relative; }
    .stereo-container { display: none; width: 100%; height: 100vh; }
    .canvas-container { width: 50%; height: 100%; float: right; }
    canvas { width: 100%; height: 100%; display: block; }
    .controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 100;
    }
    .btn {
      background: rgba(255,255,255,0.3); color: #fff; border: none;
      padding: 12px 24px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- نمایش معمولی -->
  <div id="normalView" class="container">
    <canvas id="mainCanvas"></canvas>
    <div class="controls">
      <button class="btn" onclick="enterStereoMode()">👓 حالت استریو</button>
    </div>
  </div>

  <!-- نمایش استریوسکوپی -->
  <div id="stereoView" class="stereo-container">
    <div class="canvas-container"><canvas id="leftCanvas"></canvas></div>
    <div class="canvas-container"><canvas id="rightCanvas"></canvas></div>
    <div class="controls">
      <button class="btn" onclick="exitStereoMode()">✖ خروج</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls, model;
    let leftScene, leftCamera, leftRenderer, rightScene, rightCamera, rightRenderer;
    let leftControls, rightControls;
    let isStereoMode = false;
    const IPD = 0.5; // فاصله دو چشم
    const modelFile = "cross_section_of_artery_1.glb";

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0,0,5);

      renderer = new THREE.WebGLRenderer({canvas: document.getElementById("mainCanvas"), antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      controls = new THREE.OrbitControls(camera, renderer.domElement);

      // نور
      scene.add(new THREE.AmbientLight(0x404040, 2));
      let dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(1,1,1);
      scene.add(dirLight);

      // بارگذاری مدل
      new THREE.GLTFLoader().load(modelFile, gltf=>{
        model = gltf.scene;
        scene.add(model);
      });

      animate();
    }

    function initStereoScenes() {
      leftScene = new THREE.Scene();
      rightScene = new THREE.Scene();

      // مدل کپی
      leftScene.add(model.clone());
      rightScene.add(model.clone());

      // دوربین‌ها
      leftCamera = new THREE.PerspectiveCamera(75, window.innerWidth/2/window.innerHeight, 0.1, 1000);
      leftCamera.position.set(0,0,5 - IPD/2);

      rightCamera = new THREE.PerspectiveCamera(75, window.innerWidth/2/window.innerHeight, 0.1, 1000);
      rightCamera.position.set(0,0,5 + IPD/2);

      // رندررها
      leftRenderer = new THREE.WebGLRenderer({canvas: document.getElementById("leftCanvas"), antialias:true});
      leftRenderer.setSize(window.innerWidth/2, window.innerHeight);

      rightRenderer = new THREE.WebGLRenderer({canvas: document.getElementById("rightCanvas"), antialias:true});
      rightRenderer.setSize(window.innerWidth/2, window.innerHeight);

      // کنترل‌های ژیروسکوپی
      leftControls = new THREE.DeviceOrientationControls(leftCamera);
      rightControls = new THREE.DeviceOrientationControls(rightCamera);

      // نور
      leftScene.add(new THREE.AmbientLight(0x404040,2));
      rightScene.add(new THREE.AmbientLight(0x404040,2));
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isStereoMode) {
        leftControls.update();
        rightControls.update();
        leftRenderer.render(leftScene,leftCamera);
        rightRenderer.render(rightScene,rightCamera);
      } else {
        controls.update();
        renderer.render(scene,camera);
      }
    }

    function enterStereoMode() {
      if (!model) { alert("مدل هنوز بارگذاری نشده"); return; }
      initStereoScenes();
      document.getElementById("normalView").style.display="none";
      document.getElementById("stereoView").style.display="block";
      isStereoMode = true;
    }

    function exitStereoMode() {
      document.getElementById("stereoView").style.display="none";
      document.getElementById("normalView").style.display="block";
      isStereoMode = false;
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
