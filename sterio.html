<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمایش استریوسکوپی مدل سه‌بعدی شریان</title>

  <!-- کتابخانه model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .normal-view {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* حالت استریوسکوپی (دو چشم) */
    .stereo {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      display: none;
    }

    .eye {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .eye-left {
      border-left: 2px solid #333;
    }

    .eye-right {
      border-right: 2px solid #333;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    
    /* برای نمایش در دستگاه موبایل با VR */
    @media (max-width: 768px) {
      .stereo {
        flex-direction: column;
      }
      .eye {
        width: 100%;
        height: 50vh;
      }
    }
  </style>
</head>
<body>

  <!-- نمای معمولی -->
  <div id="normal" class="normal-view">
    <model-viewer id="mainViewer"
      src="cross_section_of_artery_1.glb"
      alt="مدل سه‌بعدی مقطع شریان"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1.2"
      environment-image="neutral"
      style="width:100%; height:100%;"
    ></model-viewer>

    <div class="controls">
      <button class="btn" onclick="enterStereo()">👓 حالت استریوسکوپی</button>
    </div>
  </div>

  <!-- نمای استریوسکوپی -->
  <div id="stereo" class="stereo">
    <div class="eye eye-left">
      <model-viewer id="leftEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1.2"
        environment-image="neutral"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>
    <div class="eye eye-right">
      <model-viewer id="rightEye"
        src="cross_section_of_artery_1.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1.2"
        environment-image="neutral"
        style="width:100%; height:100%;"
      ></model-viewer>
    </div>

    <div class="controls">
      <button class="btn" onclick="exitStereo()">✖ خروج از حالت استریو</button>
    </div>
  </div>

  <script>
    const normalView = document.getElementById('normal');
    const stereoView = document.getElementById('stereo');
    const mainViewer = document.getElementById('mainViewer');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    
    let isStereoMode = false;
    let cameraSyncInterval;

    // تنظیمات اولیه برای حالت استریو
    function setupStereoView() {
      // تنظیم زاویه دوربین برای هر چشم
      const orbit = mainViewer.getAttribute('camera-orbit') || '0deg 75deg 105%';
      const fov = mainViewer.getAttribute('field-of-view') || '30deg';
      
      // تنظیم دوربین برای چشم چپ با کمی جابجایی به راست
      leftEye.cameraOrbit = orbit;
      leftEye.fieldOfView = fov;
      
      // تنظیم دوربین برای چشم راست با کمی جابجایی به چپ
      rightEye.cameraOrbit = orbit;
      rightEye.fieldOfView = fov;
    }

    // ورود به حالت استریوسکوپی
    function enterStereo() {
      setupStereoView();
      normalView.style.display = 'none';
      stereoView.style.display = 'flex';
      isStereoMode = true;
      
      // شروع همگام‌سازی دوربین‌ها
      startCameraSync();
      
      // اطلاع به کاربر برای استفاده از عینک VR
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        alert('لطفا تلفن خود را در عینک VR قرار دهید. برای خروج دکمه بازگشت را بزنید.');
      }
    }

    // خروج از حالت استریوسکوپی
    function exitStereo() {
      clearInterval(cameraSyncInterval);
      stereoView.style.display = 'none';
      normalView.style.display = 'block';
      isStereoMode = false;
      
      // همگام‌سازی دوربین اصلی با آخرین وضعیت
      const orbit = leftEye.getAttribute('camera-orbit');
      mainViewer.setAttribute('camera-orbit', orbit);
    }

    // همگام‌سازی دوربین‌ها در حالت استریو
    function startCameraSync() {
      cameraSyncInterval = setInterval(() => {
        if (!isStereoMode) return;
        
        // گرفتن موقعیت فعلی دوربین اصلی
        const orbit = mainViewer.getAttribute('camera-orbit');
        const target = mainViewer.getAttribute('camera-target') || '0m 0m 0m';
        
        // ایجاد افست برای ایجاد اثر استریو
        const orbitValues = orbit.match(/([-+]?\d*\.?\d+)deg/g);
        if (orbitValues && orbitValues.length >= 2) {
          const theta = parseFloat(orbitValues[0]);
          const phi = parseFloat(orbitValues[1]);
          const radius = orbit.match(/([-+]?\d*\.?\d+)m/)?.[0] || '2m';
          
          // ایجاد افست برای چشم‌ها (IPD - فاصله بین مردمکی)
          const ipdOffset = 0.5; // میزان افست به متر
          
          // محاسبه موقعیت برای چشم چپ
          const leftTheta = theta - (ipdOffset / 2);
          leftEye.setAttribute('camera-orbit', `${leftTheta}deg ${phi}deg ${radius}`);
          leftEye.setAttribute('camera-target', target);
          
          // محاسبه موقعیت برای چشم راست
          const rightTheta = theta + (ipdOffset / 2);
          rightEye.setAttribute('camera-orbit', `${rightTheta}deg ${phi}deg ${radius}`);
          rightEye.setAttribute('camera-target', target);
        }
      }, 100); // به روز رسانی هر 100 میلی‌ثانیه
    }

    // بارگذاری اولیه
    window.addEventListener('load', () => {
      // اضافه کردن event listener برای تغییرات دوربین
      mainViewer.addEventListener('camera-change', () => {
        if (isStereoMode) {
          // اگر در حالت استریو هستیم، دوربین‌ها را به روز کنیم
          startCameraSync();
        }
      });
    });
  </script>
</body>
</html>
